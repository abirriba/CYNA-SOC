global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'cyna-group-7'
    environment: 'production'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

rule_files:
  # - "alerts/*.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  - job_name: 'node-exporter'
    static_configs:
      - targets:
        - '10.0.2.10:9100'
        - '10.0.2.11:9100'
        - '10.0.2.12:9100'
        labels:
          service: 'node-exporter'

  - job_name: 'wazuh'
    static_configs:
      - targets: ['10.0.1.10:55000']
        labels:
          service: 'wazuh-manager'

  - job_name: 'docker'
    static_configs:
      - targets:
        - '10.0.2.10:9323'
        - '10.0.2.11:9323'
        - '10.0.2.12:9323'
        labels:
          service: 'docker'
